short_bio: >-
  <p>
    I am <strong>Guangchen Li<span class="profile-name-cn" lang="zh-CN">（李光宸）</span></strong>, a second-year
    <strong>M.S. student in Data Science</strong> at the <strong>University of Michigan, Ann Arbor</strong>,
    advised by <strong><a href="https://qingqu.engin.umich.edu/" target="_blank" rel="noopener">Prof. Qing Qu</a></strong>. I expect to graduate in May 2027.
  </p>
  <p>
    Before joining Michigan, I received my <strong>B.S. in Physics</strong> from <strong>Renmin University of China</strong>
    in 2025 and was a visiting student at the <strong>University of California, Davis</strong> in 2024.
    Over the past year, I have also had the pleasure of working with
    <strong><a href="https://hongtengxu.github.io/" target="_blank" rel="noopener">Prof. Hongteng Xu</a></strong>
    and <strong><a href="https://alkontar.engin.umich.edu/" target="_blank" rel="noopener">Prof. Raed Al Kontar</a></strong>.
  </p>
  <p>
    My research focuses on <strong>generative and sequence modeling</strong>, guided by a central question:
    <strong>how do the dependencies and dynamics of data shape the way models learn, generate, and adapt?</strong>
    By understanding these relationships, I aim to characterize models’ capabilities and limitations
    and use these insights to develop <strong>more generalizable and efficient models</strong>.
    My past work has focused on <strong>conditional adaptation of sequence models</strong> and
    <strong>the relationship between data dependencies and training and generation order</strong>,
    combining method development, controlled experiments, and theoretical analysis.
  </p>
  <p>
    Recently, I have started exploring the <strong>foundations of in-context learning in world models</strong>,
    focusing on generalization and its limits in changing environments.
    Feel free to reach out for discussions or potential collaborations on related topics.
  </p>

