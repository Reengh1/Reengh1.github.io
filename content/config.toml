[site]
title = "GuangChen Li's Homepage"
description = "GuangChen Li is an M.S. student in Data Science at the University of Michigan, researching temporal point processes, agentic AI, and diffusion models."
favicon = "/favicon.ico"
last_updated = "August 7, 2026"

[author]
name = "GuangChen Li (李光宸)"
title = "M.S. Student in Data Science"
institution = "University of Michigan"
avatar = "/bio.jpg"

[social]
# Contact information (leave blank or delete to hide)

email = "gcli@umich.edu"
location = "Ann Arbor, Michigan"
